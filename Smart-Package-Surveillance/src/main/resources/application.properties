spring.application.name=Smart-Package-Surveillance
server.port=8080

# ---- PostgreSQL (create the DB first: CREATE DATABASE smart_package;) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_package}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT (secret must be Base64, >= 256 bits) ----
jwt.secret=${JWT_SECRET:c21hcnQtcGFja2FnZS1zdXJ2ZWlsbGFuY2UtZGVmYXVsdC1zZWNyZXQta2V5LTIwMjY=}
jwt.expiration=86400000

# ---- ESP32 devices send this in the X-Device-Key header ----
device.api-key=${DEVICE_API_KEY:esp32-secret-key-change-me}

# ---- Default admin created at first start ----
app.admin.email=${ADMIN_EMAIL:admin@smart.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345}
app.admin.name=Admin

# ---- Alert thresholds ----
alert.temperature.max=30
alert.humidity.max=80
